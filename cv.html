<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio CV - ProCV</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f0f0f0;
            min-height: 100vh;
        }
        .cv-header-bar {
            background: #0F172A;
            color: white;
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .cv-header-bar a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }
        .cv-header-bar a:hover { text-decoration: underline; }
        .cv-header-bar .logo {
            font-size: 18px;
            font-weight: 800;
        }
        .cv-header-bar .logo .highlight { color: #2563EB; }
        .cv-page {
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: calc(100vh - 56px);
        }
        .cv-container {
            width: 794px;
            background: white;
            box-shadow: 0 4px 24px rgba(0,0,0,0.12);
            min-height: 1123px;
            overflow: hidden;
        }
        .cv-loading {
            text-align: center;
            padding: 100px 20px;
            color: #94A3B8;
        }
        .cv-loading i {
            font-size: 48px;
            color: #2563EB;
            animation: spin 1s linear infinite;
        }
        .cv-loading p {
            margin-top: 16px;
            font-size: 16px;
        }
        .cv-not-found {
            text-align: center;
            padding: 80px 20px;
            color: #94A3B8;
        }
        .cv-not-found i {
            font-size: 64px;
            color: #CBD5E1;
            margin-bottom: 16px;
        }
        .cv-not-found h3 {
            font-size: 24px;
            font-weight: 700;
            color: #1E293B;
            margin-bottom: 8px;
        }
        .cv-not-found p {
            font-size: 16px;
        }
        .cv-not-found a {
            display: inline-block;
            margin-top: 16px;
            color: #2563EB;
            text-decoration: none;
        }
        .cv-not-found a:hover { text-decoration: underline; }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @media (max-width: 820px) {
            .cv-container { width: 100%; min-height: auto; }
            .cv-page { padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="cv-header-bar">
        <span class="logo">📄 Pro<span class="highlight">CV</span></span>
    </div>
    <div class="cv-page">
        <div class="cv-container" id="cvContainer">
            <div class="cv-loading">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading your portfolio CV...</p>
            </div>
        </div>
    </div>
    <script>
        // ============================================================
        // GET USER ID AND CV ID FROM URL
        // ============================================================
        function getIdsFromUrl() {
            // Try query parameters first (?userId=xxx&cvId=xxx)
            const params = new URLSearchParams(window.location.search);
            let userId = params.get('userId') || '';
            let cvId = params.get('cvId') || '';
            
            // If no query params, try path (/cv/userId/cvId)
            if (!userId || !cvId) {
                const pathParts = window.location.pathname.split('/');
                // Check if it's /cv/userId/cvId format
                if (pathParts[1] === 'cv' && pathParts.length >= 4) {
                    userId = pathParts[2] || '';
                    cvId = pathParts[3] || '';
                }
            }
            
            return { userId, cvId };
        }

        // ============================================================
        // LOAD CV DATA
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            const { userId, cvId } = getIdsFromUrl();
            
            console.log('📄 User ID:', userId);
            console.log('📄 CV ID:', cvId);
            
            const container = document.getElementById('cvContainer');
            
            if (!userId || !cvId) {
                container.innerHTML = `
                    <div class="cv-not-found">
                        <i class="fas fa-exclamation-circle"></i>
                        <h3>Invalid CV Link</h3>
                        <p>This CV link is not valid. Please check the URL and try again.</p>
                        <a href="index.html">← Back to Home</a>
                    </div>
                `;
                return;
            }
            
            let cvData = null;
            
            // Try to load from localStorage
            const key = `procv_user_cvs_${userId}`;
            console.log('🔑 Storage key:', key);
            
            try {
                const storedData = localStorage.getItem(key);
                console.log('📂 Stored data:', storedData ? 'Found' : 'Not found');
                
                if (storedData) {
                    const allCvs = JSON.parse(storedData);
                    console.log('📂 All CVs:', allCvs.length);
                    
                    const foundCv = allCvs.find(c => c.id === cvId);
                    
                    if (foundCv) {
                        console.log('✅ Found CV:', foundCv.templateName);
                        cvData = foundCv.data || {};
                    } else if (allCvs.length > 0) {
                        console.log('🔍 CV not found, using first CV');
                        cvData = allCvs[0].data || {};
                    }
                }
            } catch (e) {
                console.error('Error loading CV:', e);
            }
            
            // If no data found, use demo data
            if (!cvData || Object.keys(cvData).length === 0) {
                console.log('📋 No CV data found, using demo data');
                cvData = {
                    fullName: 'Jane Doe',
                    professionalTitle: 'Front-End Developer',
                    email: 'jane@example.com',
                    phone: '+1 234 567 890',
                    location: 'San Francisco, CA',
                    linkedin: 'linkedin.com/in/janedoe',
                    website: 'janedoe.dev',
                    summary: 'Passionate front-end developer with 5+ years of experience.',
                    skills: ['JavaScript', 'React', 'CSS', 'Git', 'TypeScript'],
                    experience: [
                        { company: 'TechCorp Inc.', position: 'Senior Developer', startDate: '2020', endDate: 'Present', description: 'Led front-end development for 3 major product lines.' }
                    ],
                    education: [
                        { school: 'University of California', degree: 'B.S.', field: 'Computer Science', startDate: '2015', endDate: '2019' }
                    ],
                    projects: [],
                    languages: []
                };
            }
            
            console.log('📊 CV Data:', cvData);
            
            // Render the CV
            renderCVManual(container, cvData);
        });
        
        // ============================================================
        // RENDER CV MANUALLY
        // ============================================================
        function renderCVManual(container, data) {
            // Build Education HTML
            let educationHtml = '';
            if (data.education && data.education.length > 0) {
                educationHtml = `
                    <div style="margin-bottom:16px;">
                        <div style="font-size:16px;font-weight:700;text-transform:uppercase;border-bottom:1px solid #ddd;padding-bottom:4px;margin-bottom:8px;">Education</div>
                        ${data.education.map((edu, index) => `
                            <div style="margin-bottom:14px;padding-bottom:14px;${index < data.education.length - 1 ? 'border-bottom:1px solid #f0f0f0;' : ''}">
                                ${edu.school ? `<div style="font-weight:600;font-size:14px;">${edu.school}</div>` : ''}
                                ${edu.degree || edu.field ? `<div style="font-size:13px;color:#555;margin-top:2px;">${edu.degree || ''}${edu.degree && edu.field ? ' - ' : ''}${edu.field || ''}</div>` : ''}
                                ${edu.startDate || edu.endDate ? `<div style="font-size:12px;color:#666;margin-top:2px;">${edu.startDate || ''}${edu.startDate && edu.endDate ? ' - ' : ''}${edu.endDate || ''}</div>` : ''}
                                ${edu.description ? `<div style="font-size:13px;color:#333;margin-top:4px;">${edu.description}</div>` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // Build Experience HTML
            let experienceHtml = '';
            if (data.experience && data.experience.length > 0) {
                experienceHtml = `
                    <div style="margin-bottom:16px;">
                        <div style="font-size:16px;font-weight:700;text-transform:uppercase;border-bottom:1px solid #ddd;padding-bottom:4px;margin-bottom:8px;">Work Experience</div>
                        ${data.experience.map((exp, index) => `
                            <div style="margin-bottom:14px;padding-bottom:14px;${index < data.experience.length - 1 ? 'border-bottom:1px solid #f0f0f0;' : ''}">
                                ${exp.company ? `<div style="font-weight:600;font-size:14px;">${exp.company}</div>` : ''}
                                ${exp.position ? `<div style="font-size:13px;color:#555;margin-top:2px;">${exp.position}</div>` : ''}
                                ${exp.startDate || exp.endDate ? `<div style="font-size:12px;color:#666;margin-top:2px;">${exp.startDate || ''}${exp.startDate && exp.endDate ? ' - ' : ''}${exp.endDate || ''}</div>` : ''}
                                ${exp.description ? `<div style="font-size:13px;color:#333;margin-top:4px;line-height:1.6;">${exp.description}</div>` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // Build Projects HTML
            let projectsHtml = '';
            if (data.projects && data.projects.length > 0) {
                projectsHtml = `
                    <div style="margin-bottom:16px;">
                        <div style="font-size:16px;font-weight:700;text-transform:uppercase;border-bottom:1px solid #ddd;padding-bottom:4px;margin-bottom:8px;">Projects</div>
                        ${data.projects.map((proj, index) => `
                            <div style="margin-bottom:14px;padding-bottom:14px;${index < data.projects.length - 1 ? 'border-bottom:1px solid #f0f0f0;' : ''}">
                                ${proj.name ? `<div style="font-weight:600;font-size:14px;">${proj.name}</div>` : ''}
                                ${proj.description ? `<div style="font-size:13px;color:#444;margin-top:4px;">${proj.description}</div>` : ''}
                                ${proj.technologies ? `<div style="font-size:12px;color:#888;margin-top:4px;font-weight:500;">Technologies: ${proj.technologies}</div>` : ''}
                                ${proj.link ? `<div style="font-size:12px;color:#2563EB;margin-top:4px;"><a href="${proj.link}" target="_blank" style="color:#2563EB;text-decoration:none;">🔗 ${proj.link}</a></div>` : ''}
                            </div>
                        `).join('')}
                    </div>
                `;
            }

            // Build Skills HTML
            let skillsHtml = '';
            if (data.skills && data.skills.length > 0) {
                skillsHtml = `
                    <div style="margin-bottom:16px;">
                        <div style="font-size:16px;font-weight:700;text-transform:uppercase;border-bottom:1px solid #ddd;padding-bottom:4px;margin-bottom:8px;">Skills</div>
                        <div style="display:flex;flex-wrap:wrap;gap:8px;">
                            ${data.skills.map(skill => `<span style="background:#f0f0f0;padding:4px 12px;border-radius:4px;font-size:13px;">${skill}</span>`).join('')}
                        </div>
                    </div>
                `;
            }

            // Build Languages HTML
            let languagesHtml = '';
            if (data.languages && data.languages.length > 0) {
                languagesHtml = `
                    <div>
                        <div style="font-size:16px;font-weight:700;text-transform:uppercase;border-bottom:1px solid #ddd;padding-bottom:4px;margin-bottom:8px;">Languages</div>
                        <div style="display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:#444;">
                            ${data.languages.map(lang => `<span>${lang.language || ''}${lang.proficiency ? ' — ' + lang.proficiency : ''}</span>`).join('')}
                        </div>
                    </div>
                `;
            }

            container.innerHTML = `
                <div style="padding:40px;font-family:'Inter',sans-serif;max-width:100%;background:white;min-height:1123px;color:#1a1a1a;">
                    <div style="text-align:center;border-bottom:3px solid #1a1a1a;padding-bottom:16px;margin-bottom:20px;">
                        <div style="font-size:28px;font-weight:700;text-transform:uppercase;letter-spacing:2px;">${data.fullName || 'Your Name'}</div>
                        <div style="font-size:16px;color:#555;margin-top:4px;">${data.professionalTitle || 'Professional Title'}</div>
                        <div style="display:flex;justify-content:center;gap:16px;font-size:12px;color:#555;margin-top:8px;flex-wrap:wrap;">
                            ${data.email ? `<span>✉️ ${data.email}</span>` : ''}
                            ${data.phone ? `<span>📱 ${data.phone}</span>` : ''}
                            ${data.location ? `<span>📍 ${data.location}</span>` : ''}
                            ${data.linkedin ? `<span>🔗 ${data.linkedin}</span>` : ''}
                            ${data.website ? `<span>🌐 ${data.website}</span>` : ''}
                        </div>
                    </div>
                    
                    ${data.summary ? `
                    <div style="margin-bottom:16px;">
                        <div style="font-size:16px;font-weight:700;text-transform:uppercase;border-bottom:1px solid #ddd;padding-bottom:4px;margin-bottom:8px;">Professional Summary</div>
                        <div style="font-size:14px;line-height:1.8;color:#333;">${data.summary}</div>
                    </div>
                    ` : ''}
                    
                    ${experienceHtml}
                    ${educationHtml}
                    ${skillsHtml}
                    ${projectsHtml}
                    ${languagesHtml}
                </div>
            `;
            
            console.log('✅ CV rendered');
        }
    </script>
</body>
</html>
